# L'équipe de Riot Machine, telle que Michael la voit dans la régie (page Crew).
# Chaque agent a ses consignes dans .claude/agents/<fichier>.md ; `lit` : documents de docs/savoir/.
crew:
- key: orchestrateur
  fichier: null
  titre: Le chef de production
  role: Fait avancer chaque clip. Il réveille le bon agent au bon moment, trie tes retours et vérifie que tout avance.
    Il ne décide jamais à ta place.
  quand: À chaque passage de production, lancé tout seul par le worker.
  departement: Production
- key: scenariste
  fichier: scenariste
  titre: L'atelier d'idées
  role: Lit un brainstorm brut et propose un pitch, un concept, des blocs et des idées de plans. Tu acceptes ou
    écartes chaque partie.
  quand: Quand tu colles un brainstorm dans l'onglet Dossier.
  departement: Écriture
- key: script-doctor
  fichier: script-doctor
  titre: Le scénariste et scripte
  role: 'Screenwriter : écrit le script plan par plan (ce qu''on voit, le prompt détaillé), la structure et le rythme,
    d''après ton dossier, tes sources et ta direction artistique ; tient la mémoire de réalisation et crée les tenues.
    Script supervisor : veille à la continuité d''un plan à l''autre (tenues, objets présents ou absents, accessoires,
    déplacements et sens des regards, lumière d''une même scène) et à la cohérence de toutes les références @.'
  quand: Quand tu envoies ton dossier, demandes une modif sur le découpage ou un plan, ou ajoutes des sources.
  lit:
  - createurs-methodes-et-prompts.md
  departement: Écriture
- key: decorateur
  fichier: decorateur
  titre: Le décorateur
  role: Repère les décors, objets et figurants, écrit leur fiche (apparence seule), relie les plans, et écrit le
    prompt HD d'après ton image de départ.
  quand: Une fois le découpage complet, et dès que tu déposes une image de départ.
  departement: Direction artistique
- key: directeur-casting
  fichier: directeur-casting
  titre: Le directeur de casting
  role: Tient le pack de référence des personnages (canon, fiche, résumé visuel, images en plus si tu le demandes).
  quand: Quand tu demandes des images en plus pour un personnage.
  lit:
  - personnages-canon-et-feuille.md
  departement: Direction artistique
- key: storyboard
  fichier: storyboard
  titre: Le storyboardeur
  role: Écrit le prompt et lance le visuel de départ de chaque plan, avec les références du plan (personnages, tenues,
    décors, objets).
  quand: Pour chaque plan d'un bloc validé.
  lit:
  - banque-camera.md
  - createurs-methodes-et-prompts.md
  - personnages-canon-et-feuille.md
  departement: Image
- key: routeur
  fichier: routeur
  titre: Le directeur technique
  role: 'Choisit pour chaque plan le modèle vidéo et le fournisseur : celui qui fera le travail (mouvement, durée,
    personnages, chant) au meilleur prix, avec une raison que tu peux contester. Il tient le carnet de rodage des
    modèles.'
  quand: Quand un plan passe au plan vidéo.
  lit:
  - economiser-les-credits.md
  - fournisseurs-a-tester.md
  departement: Vidéo
- key: prompteur
  fichier: prompteur
  titre: Le prompteur
  role: 'Écrit le prompt de chaque vidéo pour le modèle choisi : action, mouvement de caméra, rythme. Il connaît
    la banque de plans et de mouvements de caméra.'
  quand: Après le routeur, avant que tu valides le plan vidéo.
  lit:
  - banque-camera.md
  - createurs-methodes-et-prompts.md
  departement: Vidéo
- key: finition
  fichier: finition
  titre: La finition
  role: S'occupe du rendu final, de l'upscale et du lip-sync quand ils posent problème.
  quand: Quand une vidéo HD ou un lip-sync échoue.
  departement: Vidéo
- key: controleur
  fichier: controleur
  titre: Le contrôleur
  role: Contrôle chaque visuel et chaque vidéo avant toi (personnage, anatomie, artefacts, respect de la DA). Il
    refuse ce qui ne va pas.
  quand: Après chaque visuel et chaque vidéo générés.
  departement: Contrôle qualité
departements:
- nom: Production
  role: Fait avancer chaque clip et coordonne l'équipe.
- nom: Écriture
  role: Du brainstorm au découpage plan par plan, et la continuité.
- nom: Direction artistique
  role: 'Les personnages, les décors, les objets, les figurants et les tenues : ce qui doit rester identique.'
- nom: Image
  role: Le visuel de départ de chaque plan.
- nom: Vidéo
  role: Le choix du modèle, le prompt vidéo, le rendu final et le lip-sync.
- nom: Contrôle qualité
  role: Tout est vérifié avant de t'arriver.
