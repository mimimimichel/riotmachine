<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0911">
  <title>Riot Machine</title>
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-led"></span>RIOT<b>MACHINE</b></a>
    <nav class="mainnav">
      <a href="#/" data-nav="studio">Studio</a>
      <a href="#/personnages" data-nav="personnages">Personnages</a>
      <a href="#/crew" data-nav="crew">Crew</a>
      <a href="#/depenses" data-nav="depenses">Dépenses<span id="nav-spend-n" class="nav-n"></span></a>
      <a href="#/fournisseurs" data-nav="fournisseurs">Fournisseurs</a>
      <a href="#/conso" data-nav="conso">Conso<span id="nav-conso-n" class="nav-n"></span></a>
    </nav>
    <div class="sysstat" id="sysstat"></div>
    <button class="todobtn" id="todobtn" aria-label="À faire" aria-haspopup="true" aria-expanded="false" title="À faire">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M3.5 6l1.2 1.2L7 4.8M3.5 12l1.2 1.2L7 10.8M3.5 18l1.2 1.2L7 16.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span class="todo-n" id="todo-n" hidden></span></button>
    <button class="fsbtn" id="fsbtn" title="Plein écran" aria-label="Plein écran">⛶</button>
  </header>
  <main id="view" tabindex="-1"><p class="loading">Chargement…</p></main>
  <aside id="drawer" class="drawer" hidden></aside>
  <div id="todopop" class="todopop" role="dialog" aria-label="À faire" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
  <script src="/static/v3.js"></script>
  <script>
    /* plein écran sans installation : un toucher suffit ; une fois choisi, il revient au premier toucher */
    (function () {
      const el = document.documentElement, btn = document.getElementById("fsbtn");
      const on = () => !!document.fullscreenElement;
      const want = () => { try { return localStorage.getItem("riot:fullscreen") === "1"; } catch (e) { return false; } };
      const keep = (v) => { try { localStorage.setItem("riot:fullscreen", v ? "1" : "0"); } catch (e) {} };
      const enter = () => el.requestFullscreen && el.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
      if (!el.requestFullscreen || window.matchMedia("(display-mode: standalone)").matches) { btn.hidden = true; return; }
      btn.addEventListener("click", (e) => { e.stopPropagation(); if (on()) { keep(false); document.exitFullscreen(); } else { keep(true); enter(); } });
      document.addEventListener("pointerdown", () => { if (want() && !on()) enter(); }, true);
      document.addEventListener("fullscreenchange", () => { btn.textContent = on() ? "✕" : "⛶"; btn.title = on() ? "Quitter le plein écran" : "Plein écran"; });
    })();
  </script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});</script>
</body>
</html>
