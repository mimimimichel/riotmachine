    durations: [3, 4, 5, 6, 7, 8, 9, 10]
    final_mode: keep
    price: {per_second: {"720p": 0.101, "1080p": 0.152}}
    input: {prompt: prompt, image: image, duration: duration, negative_prompt: negative_prompt, aspect_ratio: aspect_ratio}
    draft_params: {resolution: "1080p"}
    final_params: {resolution: "1080p"}

  # ------------------------------------------------------------- finition
  topaz-image-hf:
    label: Topaz haute fidélité (image)
    provider: fal
    kind: upscale_image
    endpoint: fal-ai/topaz/upscale/image
    output: image.url
    price: {per_image: 0.08}      # jusqu'à 24 Mpx en sortie (vérifié le 22/10/2026)
    input: {image: image_url}
    # face_enhancement coupé : il redessine les visages, donc change l'identité
    defaults: {model: High Fidelity V2, upscale_factor: 2, face_enhancement: false, output_format: png}

  seedvr-image:
    label: SeedVR (image)
    provider: fal
    kind: upscale_image
    endpoint: fal-ai/seedvr/upscale/image
    output: image.url
    price: {per_image: 0.01}      # 0,001 $ par mégapixel (vérifié le 22/10/2026)
    input: {image: image_url}
    defaults: {upscale_mode: factor, upscale_factor: 2, output_format: png}

  seedvr-1080p:
    label: SeedVR (vidéo 1080p)
    provider: fal
    kind: upscale
    endpoint: fal-ai/seedvr/upscale/video
    output: video.url
    # 0,001 $ par mégapixel : ~0,05 $/s en 1080p à 24 i/s
    price: {per_second: 0.05}
    input: {video: video_url}
    defaults: {upscale_mode: target, target_resolution: 1080p, output_format: "X264 (.mp4)"}

  topaz-2x:
    label: Topaz (vidéo x2)
    provider: fal
    kind: upscale
    endpoint: fal-ai/topaz/upscale/video
    output: video.url
    price: {per_second: 0.02}
    input: {video: video_url}
    defaults: {upscale_factor: 2, H264_output: true}

  sync-lipsync-2-pro:
    label: Sync Lipsync 2 Pro
    provider: fal
    kind: lipsync
    endpoint: fal-ai/sync-lipsync/v2
    output: video.url
    price: {per_second: 0.0835}   # ~5 $ par minute en lipsync-2-pro
    input: {video: video_url, audio: audio_url}
    defaults: {model: lipsync-2-pro, sync_mode: cut_off}

  sync-lipsync-2:
    label: Sync Lipsync 2
    provider: fal
    kind: lipsync
    endpoint: fal-ai/sync-lipsync/v2
    output: video.url
