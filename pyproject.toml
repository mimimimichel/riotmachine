[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riotmachine"
version = "0.1.0"
description = "Studio multi-agent de production de clips vidéo IA (Claude Code + fal)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "google-auth[requests]>=2.30",          # jeton OAuth pour Vertex AI (Veo)
  "librosa>=0.10",                         # analyse du morceau : tempo et temps
  "faster-whisper>=1.0",                   # position des paroles dans le morceau
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
riot = "riotmachine.cli:main"

[tool.setuptools.packages.find]
include = ["riotmachine*"]

[tool.setuptools.package-data]
riotmachine = ["regie/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
