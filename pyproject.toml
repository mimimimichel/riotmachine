[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riotmachine"
version = "3.0.0a1"
description = "Riot Machine v3 : label d'artistes IA et studio de clips"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
riot = "riotmachine.cli:main"

[tool.setuptools.packages.find]
include = ["riotmachine*"]

[tool.setuptools.package-data]
riotmachine = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
